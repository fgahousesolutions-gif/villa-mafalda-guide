<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef in Villa - Villa Mafalda</title>
  <style>
    :root {
      --bg: #eef0f4;
      --card: #f7f7f8;
      --text: #18213c;
      --muted: #5f6c80;
      --primary: #0f1b3d;
      --primary-hover: #162754;
      --border: #273454;
      --soft-border: rgba(39, 52, 84, 0.14);
      --shadow: 0 18px 50px rgba(15, 27, 61, 0.14);
      --radius-xl: 26px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px;
    }

    .hero,
    .card {
      overflow: hidden;
      border-radius: var(--radius-xl);
      background: var(--card);
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .hero-photo {
      width: 100%;
      height: min(72vh, 680px);
      min-height: 430px;
      object-fit: cover;
      display: block;
    }

    .hero-content,
    .card {
      padding: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(38px, 6vw, 66px);
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      margin: 0;
    }

    .lead {
      max-width: 780px;
      color: #26314f;
      font-size: clamp(18px, 2.3vw, 23px);
    }

    .lang-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .lang-btn,
    .btn,
    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      border: 2px solid var(--border);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .lang-btn,
    .btn.secondary,
    .contact-link {
      color: var(--text);
      background: transparent;
    }

    .lang-btn:hover,
    .lang-btn.active,
    .btn.secondary:hover,
    .contact-link:hover {
      background: #e9edf5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      color: #fff;
      background: var(--primary);
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 22px;
      align-items: start;
    }

    .copy-stack {
      display: grid;
      gap: 18px;
    }

    .muted {
      color: var(--muted);
    }

    .highlight-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 4px;
    }

    .highlight,
    .contact-card {
      padding: 16px;
      border: 1px solid var(--soft-border);
      border-radius: 18px;
      background: #fff;
      font-weight: 700;
    }

    .contact-card {
      display: grid;
      gap: 12px;
      font-weight: 400;
    }

    .contact-link {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      word-break: break-word;
    }

    .note {
      padding: 18px;
      border-radius: 18px;
      background: #fff7ed;
      color: #7c2d12;
      font-weight: 650;
    }

    @media (max-width: 820px) {
      .wrap {
        padding: 14px;
      }

      .hero-photo {
        height: 56vh;
        min-height: 340px;
      }

      .hero-content,
      .card {
        padding: 22px;
      }

      .content-grid,
      .highlight-grid {
        grid-template-columns: 1fr;
      }

      .btn,
      .lang-btn {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <img class="hero-photo" src="pasta-only.jpeg" alt="Fresh pasta lesson with Simonetta Garelli">
      <div class="hero-content">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
        <div class="actions">
          <a class="btn" id="book-btn" href="https://simonettagarelli.com" target="_blank" rel="noopener noreferrer"></a>
          <a class="btn secondary" id="back-btn" href="index.html"></a>
        </div>
        <div class="lang-grid" aria-label="Language selector">
          <button type="button" class="lang-btn" data-lang="it">Italiano</button>
          <button type="button" class="lang-btn" data-lang="en">English</button>
          <button type="button" class="lang-btn" data-lang="de">Deutsch</button>
          <button type="button" class="lang-btn" data-lang="fr">Français</button>
          <button type="button" class="lang-btn" data-lang="es">Español</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="content-grid">
        <div class="copy-stack">
          <p class="eyebrow" id="lesson-kicker"></p>
          <h2 id="section-title"></h2>
          <p class="muted" id="bio-text"></p>
          <p class="muted" id="experience-text"></p>

          <div class="highlight-grid">
            <div class="highlight" id="highlight-1"></div>
            <div class="highlight" id="highlight-2"></div>
            <div class="highlight" id="highlight-3"></div>
            <div class="highlight" id="highlight-4"></div>
          </div>

          <p class="note" id="note"></p>
        </div>

        <aside class="contact-card">
          <h3 id="contacts-title"></h3>
          <a class="contact-link" href="mailto:simonettagarelli@yahoo.it">✉️ simonettagarelli@yahoo.it</a>
          <a class="contact-link" href="tel:+3939349556383">📞 +39 393 49556383</a>
          <a class="contact-link" href="https://simonettagarelli.com" target="_blank" rel="noopener noreferrer">🌐 simonettagarelli.com</a>
          <p class="muted" id="booking-text"></p>
        </aside>
      </div>
    </section>
  </div>

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value || "";
    }

    function render(lang) {
      const t = CONTENT[lang] || CONTENT.it;
      document.documentElement.lang = lang;
      document.title = `Villa Mafalda - ${t.pageTitle}`;

      setText("eyebrow", t.eyebrow);
      setText("title", t.title);
      setText("lead", t.lead);
      setText("book-btn", t.bookBtn);
      setText("back-btn", t.backBtn);
      setText("lesson-kicker", t.lessonKicker);
      setText("section-title", t.sectionTitle);
      setText("bio-text", t.bioText);
      setText("experience-text", t.experienceText);
      setText("highlight-1", t.highlight1);
      setText("highlight-2", t.highlight2);
      setText("highlight-3", t.highlight3);
      setText("highlight-4", t.highlight4);
      setText("note", t.note);
      setText("contacts-title", t.contactsTitle);
      setText("booking-text", t.bookingText);

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
    }

    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => render(btn.dataset.lang));
    });

    render("it");
  </script>
</body>
</html>
