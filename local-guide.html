const byId=(id)=>document.getElementById(id);
let language='it',category='breakfast';
const t=(k)=>C[language]?.[k]||C.it[k]||'';
function renderCard(v){
 const el=document.createElement('article');el.className='place';
 const top=document.createElement('div');top.className='place-top';
 const h=document.createElement('h3');h.textContent=v.name;top.append(h);
 const tag=document.createElement('span');tag.className='tag';tag.textContent=t('tag_'+v.typ);top.append(tag);el.append(top);
 const loc=document.createElement('p');loc.className='place-location';loc.textContent=v.town;el.append(loc);
 const desc=document.createElement('p');desc.className='place-desc';desc.textContent=v.desc[language]||v.desc.en||v.desc.it;el.append(desc);
 const links=document.createElement('div');links.className='place-links';
 const map=document.createElement('a');map.className='place-link primary';map.target='_blank';map.rel='noopener noreferrer';map.href=v.maps;map.textContent='↗  '+t('maps');links.append(map);
 if(v.site){const site=document.createElement('a');site.className='place-link';site.target='_blank';site.rel='noopener noreferrer';site.href=v.site;site.textContent='↗  '+t('site');links.append(site)}
 el.append(links);return el;
}
function render(){
 const assign={back:'back',kicker:'kicker',title:'cover-title',intro:'intro',breakfast:'breakfast-label',dining:'dining-label',countb:'countb',countd:'countd',stamp:'stamp',breakfastHead:'breakfast-head',breakfastIntro:'breakfast-intro',diningHead:'dining-head',diningIntro:'dining-intro',table:'table-label',takeaway:'takeaway-label',foot:'foot',noresults:'noresults'};
 for(const [key,id] of Object.entries(assign))byId(id).textContent=t(key);
 byId('place-search').placeholder=t('filter');byId('place-search').setAttribute('aria-label',t('filter'));
 byId('back').href=`index.html?lang=${language}`;
 document.documentElement.lang=language;
 document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===language)));
 byId('breakfast-grid').replaceChildren(...DATA.breakfast.map(renderCard));
 renderDining();
 document.title=`Villa Mafalda | Local Guide · ${t('breakfast')} & ${t('dining')}`;
 try{localStorage.setItem('guestGuideLang',language)}catch(e){}
}
function renderDining(){
 const search=byId('place-search').value.trim().toLocaleLowerCase();
 const filt=(v)=>(v.name+' '+v.town+' '+Object.values(v.desc).join(' ')).toLocaleLowerCase().includes(search);
 const ds=DATA.dining.filter(filt),ts=DATA.takeaway.filter(filt);
 byId('dining-grid').replaceChildren(...ds.map(renderCard));
 byId('takeaway-grid').replaceChildren(...ts.map(renderCard));
 byId('table-label').hidden=!ds.length;byId('takeaway-label').hidden=!ts.length;byId('noresults').hidden=!!(ds.length+ts.length);
}
function selectCategory(next){category=next;for(const key of ['breakfast','dining']){byId('tab-'+key).setAttribute('aria-selected',String(key===next));byId('panel-'+key).hidden=key!==next}}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{language=b.dataset.lang;render()}));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>selectCategory(b.dataset.category)));
byId('place-search').addEventListener('input',renderDining);
const q=new URLSearchParams(location.search).get('lang');let stored;try{stored=localStorage.getItem('guestGuideLang')}catch(e){}
language=C[q]?q:(C[stored]?stored:'it');render();selectCategory('breakfast');
</script>
